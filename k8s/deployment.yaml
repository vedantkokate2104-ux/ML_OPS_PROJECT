apiVersion: apps/v1
kind: Deployment
metadata:
  name: project-apex
  labels:
    app: project-apex
spec:
  replicas: 2
  selector:
    matchLabels:
      app: project-apex
  template:
    metadata:
      labels:
        app: project-apex
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9100"
        prometheus.io/path: "/metrics"
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
      containers:
        - name: streamlit
          # Replace with your registry image, e.g. <acr-name>.azurecr.io/project-apex:latest
          image: project-apex:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8501
            - name: metrics
              containerPort: 9100
          envFrom:
            - configMapRef:
                name: project-apex-config
            - secretRef:
                name: project-apex-secrets
                optional: true
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1536Mi
          startupProbe:
            httpGet:
              path: /_stcore/health
              port: http
            periodSeconds: 5
            failureThreshold: 24
          readinessProbe:
            httpGet:
              path: /_stcore/health
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /_stcore/health
              port: http
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
