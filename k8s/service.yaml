apiVersion: v1
kind: Service
metadata:
  name: project-apex
  labels:
    app: project-apex
spec:
  type: LoadBalancer   # use NodePort/ClusterIP + Ingress on local clusters
  selector:
    app: project-apex
  # Streamlit uses websockets; keep each client on the same pod
  sessionAffinity: ClientIP
  ports:
    - name: http
      port: 80
      targetPort: 8501
    - name: metrics
      port: 9100
      targetPort: 9100
