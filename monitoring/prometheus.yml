# Prometheus scrape config for the local docker-compose stack.
# (In Kubernetes, the pod annotations prometheus.io/scrape|port|path are used instead.)
global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  # Streamlit app – prometheus_client endpoint (page views, data-load latency,
  # errors, Mongo status, process CPU/memory, start time)
  - job_name: eventoracle-app
    static_configs:
      - targets: ["app:9100"]

  # Optional legacy Flask API (api_server.py) – HTTP request count & latency.
  # Shows as DOWN unless the api service is running.
  - job_name: eventoracle-api
    metrics_path: /metrics
    static_configs:
      - targets: ["api:5000"]

  # Container CPU / memory / health
  - job_name: cadvisor
    static_configs:
      - targets: ["cadvisor:8080"]

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
